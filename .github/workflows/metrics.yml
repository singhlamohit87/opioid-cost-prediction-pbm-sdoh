name: Collect GitHub Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run metrics script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python metrics/collect_metrics.py

      - name: Commit metrics
        run: |
          git config --global user.email "metrics-bot@github.com"
          git config --global user.name "Metrics Bot"
          git add metrics/
          git commit -m "Daily metrics $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
